{% extends "base.html" %}

{% block content %}
  <h2 style="margin:0 0 8px 0; color:#0f172a; font-size:18px;">
    Verify your email
  </h2>
  <p style="margin:0 0 20px 0; color:#475569; font-size:14px; line-height:1.5;">
    Enter this code in PulseCheck to verify your account. It expires in 15 minutes.
  </p>

  <div style="text-align:center; margin-bottom:20px;">
    <span style="display:inline-block; background:#f1f5f9; color:#0f172a; font-size:28px; font-weight:700; letter-spacing:6px; padding:16px 24px; border-radius:8px;">
      {{ code }}
    </span>
  </div>

  <p style="margin:0; color:#94a3b8; font-size:12px; line-height:1.5;">
    If you didn't create a PulseCheck account, you can safely ignore this email.
  </p>
{% endblock %}
