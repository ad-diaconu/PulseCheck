name: pulsecheck-test

services:
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
     - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data # RAM temporary volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 1s
      timeout: 3s
      retries: 10

  test_redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # different host port from dev's redis (6379), so both can run at once
    tmpfs:
      - /data  # RAM only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10
