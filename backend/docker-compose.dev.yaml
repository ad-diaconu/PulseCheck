name: pulsecheck-dev

services:
  db:
    image: postgres:16-alpine
    env_file:
     - .env
    ports:
     - "5432:5432"
    volumes:
     - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app/backend
    environment:
      - PYTHONPATH=/app
      - REDIS_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/pulsecheck
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  
  celery_worker:
    build: . 
    command: celery -A backend.app.core.celery_app worker --loglevel=info
    volumes:
      - .:/app/backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/pulsecheck
    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_started

  celery_beat:
    build: .
    command: celery -A backend.app.core.celery_app beat --loglevel=info
    volumes:
      - .:/app/backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/pulsecheck
    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_started

volumes:
  postgres_data_dev: