name: PulseCheck UI CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
  pull_request:
    paths:
      - 'ui/**'

jobs:
  format-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint with ESLint
        working-directory: ui
        run: npm run lint

      - name: Run tests
        working-directory: ui
        run: npm run test

      - name: Build (type-check + bundle)
        working-directory: ui
        run: npm run build
